    });
    const seg = (on) => 'font-family: inherit; font-size: 14px; cursor: pointer; min-height: 41px; padding: 0 14px; border: 0; ' + (on ? 'background: #1E2430; color: #FFFFFF' : 'background: #FFFFFF; color: #1E2430');
    const arrow = (off) => 'width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid #1E2430; display: inline-flex; align-items: center; justify-content: center; ' + (off ? 'background: #E3E6EB; color: #8A919C; border-color: #C9CDD4; cursor: default' : 'background: #FFFFFF; color: #1E2430; cursor: pointer');
    const thumbs = d.pages.map((id, i) => ({
      src: b(id), no: String(i + 1), label: (i + 1) + '쪽으로', current: i === page ? 'page' : 'false', pick: go(i),
      style: 'font-family: inherit; cursor: pointer; width: 112px; flex: 0 0 auto; padding: 4px 4px 2px; background: #FFFFFF; border-radius: 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; ' + (i === page ? 'border: 2px solid #C81E1E' : 'border: 2px solid transparent; opacity: 0.75')
    }));
    const allPages = d.pages.map((id, i) => ({ src: b(id), no: String(i + 1), alt: d.label + ' ' + (i + 1) + '쪽' }));
    const single = s.mode !== 'all';
    return {
      docTabs, cur, thumbs, allPages,
      curImg: b(d.pages[page]), curAlt: d.label + ' ' + (page + 1) + '쪽', pageNo: page + 1,
      atStart: page === 0, atEnd: page === last,
      prev: go(Math.max(page - 1, 0)), next: go(Math.min(page + 1, last)),
      prevStyle: arrow(page === 0), nextStyle: arrow(page === last),
      isSingle: single, isAll: !single,
      singlePressed: single ? 'true' : 'false', allPressed: single ? 'false' : 'true',
      singleStyle: seg(single), allStyle: seg(!single),
      showSingle: () => this.setState({ mode: 'single' }), showAll: () => this.setState({ mode: 'all' })
    };
  }
}
</script>
