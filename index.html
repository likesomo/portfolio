<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px">

<a href="#projects" onClick="{{pickSystem}}" class="card" style="text-decoration: none; border: 1.5px solid #1E2430; border-radius: 12px; padding: 28px; display: flex; flex-direction: column; gap: 12px; background: #FFFFFF">

<div style="display: flex; flex-direction: column; gap: 6px">
<strong style="font-family: 'Gowun Batang', serif; font-size: 21px">『화이트데이』 · 조우의 불확실성을 규칙으로</strong>

<section id="projects" style="max-width: 1200px; margin: 0 auto; padding: 72px 24px 24px; display: flex; flex-direction: column; gap: 28px">

<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
</sc-for>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px">
<sc-for list="{{shown}}" as="p" hint-placeholder-count="5">
<sc-if value="{{p.linked}}" hint-placeholder-val="{{ false }}">
<a href="maru.html" class="card" style="text-decoration: none; border: 1.5px solid #1E2430; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF; position: relative">
<span style="position: absolute; top: 12px; left: 12px; z-index: 1; background: #C81E1E; color: #FFFFFF; font-size: 13px; padding: 4px 12px; border-radius: 999px">자세히 보기</span>
<img src="{{p.img}}" alt="{{p.alt}}" style="width: 100%; height: 200px; object-fit: cover; object-position: {{p.pos}}; display: block; background: #F1F3F6">
<div style="padding: 20px 22px 24px; display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto">
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: #5A6270"><span>{{p.genre}}</span><span style="white-space: nowrap">{{p.period}}</span></div>
<strong style="font-family: 'Gowun Batang', serif; font-size: 21px; line-height: 1.4">{{p.title}}</strong>
<span style="font-size: 15px; color: #3B4250; white-space: pre-line">{{p.desc}}</span>
<span style="font-size: 14px; color: #1E2430; margin-top: auto; padding-top: 6px; border-top: 1px dashed #D9DDE4">{{p.role}}</span>
<span style="display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: #C81E1E"><span>{{p.axes}}</span><span>상세 보기 →</span></span>
</div>
</a>
</sc-if>
<sc-if value="{{p.isVideo}}" hint-placeholder-val="{{ false }}">
<a href="{{p.video}}" target="_blank" rel="noopener" class="card" style="text-decoration: none; border: 1.5px solid #1E2430; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF; position: relative">
<span style="position: absolute; top: 12px; left: 12px; z-index: 1; background: #1E2430; color: #FFFFFF; font-size: 13px; padding: 4px 12px; border-radius: 999px">▶ {{p.videoLabel}}</span>
<img src="{{p.img}}" alt="{{p.alt}}" style="width: 100%; height: 200px; object-fit: cover; object-position: {{p.pos}}; display: block; background: #F1F3F6">
<div style="padding: 20px 22px 24px; display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto">
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: #5A6270"><span>{{p.genre}}</span><span style="white-space: nowrap">{{p.period}}</span></div>
<strong style="font-family: 'Gowun Batang', serif; font-size: 21px; line-height: 1.4">{{p.title}}</strong>
<span style="font-size: 15px; color: #3B4250; white-space: pre-line">{{p.desc}}</span>
<span style="font-size: 14px; color: #1E2430; margin-top: auto; padding-top: 6px; border-top: 1px dashed #D9DDE4">{{p.role}}</span>
<span style="display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: #C81E1E"><span>{{p.axes}}</span><span style="white-space: nowrap">유튜브에서 보기 ↗</span></span>
</div>
</a>
</sc-if>
<sc-if value="{{p.plain}}" hint-placeholder-val="{{ true }}">
<div style="border: 1px solid #E3E6EB; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF">
<img src="{{p.img}}" alt="{{p.alt}}" style="width: 100%; height: 200px; object-fit: cover; object-position: {{p.pos}}; display: block; background: #F1F3F6">
<div style="padding: 20px 22px 24px; display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto">
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: #5A6270"><span>{{p.genre}}</span><span style="white-space: nowrap">{{p.period}}</span></div>
<strong style="font-family: 'Gowun Batang', serif; font-size: 21px; line-height: 1.4">{{p.title}}</strong>
<span style="font-size: 15px; color: #3B4250; white-space: pre-line">{{p.desc}}</span>
<span style="font-size: 14px; color: #1E2430; margin-top: auto; padding-top: 6px; border-top: 1px dashed #D9DDE4">{{p.role}}</span>
<span style="font-size: 13px; color: #C81E1E">{{p.axes}}</span>

</div>

<h2 style="margin: 0; font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 36px">직접 만든 AI 도구</h2>
<span style="font-size: 16px; color: #3B4250">무엇을 확인하고 무엇을 바꿀지는 제가 정하고, <br>찾고·대조하고·요약하는 반복은 AI에 맡깁니다.</span>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px">

<div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 8px"><strong style="font-family: 'Gowun Batang', serif; font-size: 19px">주별 유저 리포트</strong><span style="font-size: 15px; color: #3B4250">재화 유통량·기능별 이용률·판매 상위를 <br>BigQuery SQL로 매주 같은 기준으로 뽑고, <br>지난주 대비 변화는 LLM이 요약합니다.</span><span style="font-size: 13px; color: #5A6270; margin-top: auto">BigQuery · SQL · LLM</span></div>
<div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 8px"><strong style="font-family: 'Gowun Batang', serif; font-size: 19px">그 밖의 도구</strong><span style="font-size: 15px; color: #3B4250">코드의 분기·예외를 훑어 쓰는 TC 생성기, <br>스키마를 담은 SQL 초안 생성기, <br>사내 xml 컨버터, 그리고 AI 아트 초안을 <br>디자이너가 다듬는 팀 절차.</span><span style="font-size: 13px; color: #5A6270; margin-top: auto">Claude Code · Midjourney</span></div>
</div>
</section>
